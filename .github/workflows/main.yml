name: Build Kernel Modules

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout kernel source
      uses: actions/checkout@v3

    - name: Setup proton-clang
      run: |
        git clone --depth=1 https://github.com/kdrag0n/proton-clang.git

    - name: Prepare build
      run: |
        export PATH="$GITHUB_WORKSPACE/proton-clang/bin:$PATH"
        mkdir out
        make O=out ARCH=arm64 CC=clang olddefconfig
        make O=out ARCH=arm64 CC=clang modules_prepare

    - name: Build kernel modules
      run: |
        export PATH="$GITHUB_WORKSPACE/proton-clang/bin:$PATH"
        make -j$(nproc) O=out ARCH=arm64 CC=clang modules

    - name: Upload Module.symvers
      uses: actions/upload-artifact@v3
      with:
        name: Module.symvers
        path: out/Module.symvers

    - name: Upload .ko modules
      uses: actions/upload-artifact@v3
      with:
        name: kernel-modules
        path: out/lib/modules/
