name: KernelSU Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # Bước 1: Tải mã nguồn từ kho lưu trữ
      - name: Checkout source
        uses: actions/checkout@v4

      # Bước 2: Cài đặt công cụ và kernel headers
      - name: Set up environment
        run: |
          sudo apt update
          sudo apt install -y bc bison build-essential cpio curl flex git libssl-dev \
            libncurses-dev lzop python3 unzip zip gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi

      # Bước 3: Tải và giải nén Proton Clang
      - name: Download and extract Proton Clang
        run: |
          mkdir -p clang
          curl -Lo clang/proton-clang.tar.gz https://github.com/LineageOS/android_prebuilt_clang/releases/download/18.1.8-r3/proton-clang-18.1.8.tar.gz
          if [ $? -ne 0 ]; then
            echo "Error: Failed to download Proton Clang"
            exit 1
          fi
          file clang/proton-clang.tar.gz | grep -q "gzip compressed data" || { echo "Error: Downloaded file is not a valid gzip archive"; exit 1; }
          tar -C clang -xzf clang/proton-clang.tar.gz --strip-components=1
          if [ $? -ne 0 ]; then
            echo "Error: Failed to extract Proton Clang"
            exit 1
          fi

      # Bước 4: Thiết lập biến môi trường
      - name: Set environment variables
        run: |
          echo "CLANG_PATH=$GITHUB_WORKSPACE/clang" >> $GITHUB_ENV
          echo "PATH=$GITHUB_WORKSPACE/clang/bin:$PATH" >> $GITHUB_ENV

      # Bước 5: Kiểm tra và sao chép .config
      - name: Copy .config
        run: |
          if [ -f .config ]; then
            echo "Found .config in repository root"
            mkdir -p out
            cp .config out/.config
          else
            echo "Error: .config not found in repository root"
            exit 1
          fi

      # Bước 6: Chuẩn bị môi trường kernel
      - name: Prepare kernel build environment
        run: |
          make O=out ARCH=arm64 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            CC=clang \
            LLVM=1 \
            olddefconfig
          make O=out ARCH=arm64 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            CC=clang \
            LLVM=1 \
            modules_prepare

      # Bước 7: Biên dịch kernel modules
      - name: Build kernel modules
        run: |
          make O=out ARCH=arm64 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            CC=clang \
            LLVM=1 \
            modules
        env:
          KDIR: /lib/modules/$(uname -r)/build

      # Bước 8: Lưu trữ Module.symvers
      - name: Upload Module.symvers
        uses: actions/upload-artifact@v4
        with:
          name: Module.symvers
          path: out/Module.symvers
          retention-days: 7

      # Bước 9: Lưu trữ .ko modules
      - name: Upload .ko modules
        uses: actions/upload-artifact@v4
        with:
          name: kernel-modules
          path: |
            out/**/*.ko
          retention-days: 7

      # Bước 10: Kiểm tra kết quả
      - name: Verify artifacts
        run: |
          ls -l out/Module.symvers out/**/*.ko || echo "No artifacts found"
