name: Kernel Module Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # Bước 1: Tải mã nguồn từ kho lưu trữ
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          repository: ldt2003/No-ker
          token: ${{ secrets.GITHUB_TOKEN }}

      # Bước 2: Cài đặt công cụ và phụ thuộc
      - name: Set up environment
        run: |
          sudo apt update
          sudo apt install -y bc bison build-essential cpio curl flex git libssl-dev \
            libncurses-dev lzop python3 unzip zip gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi \
            libc6-dev binutils libgcc-s1 libstdc++6 gcc

      # Bước 3: Tải và giải nén Silont Clang
      - name: Download and extract Silont Clang
        run: |
          mkdir -p clang
          curl -Lo clang/silont-clang.tar.gz https://github.com/silont-project/silont-clang/tarball/master
          if [ $? -ne 0 ]; then
            echo "Error: Failed to download Silont Clang"
            exit 1
          fi
          file clang/silont-clang.tar.gz | grep -q "gzip compressed data" || { echo "Error: Downloaded file is not a valid gzip archive"; exit 1; }
          tar -C clang -xzf clang/silont-clang.tar.gz --strip-components=1
          if [ $? -ne 0 ]; then
            echo "Error: Failed to extract Silont Clang"
            exit 1
          fi

      # Bước 4: Thiết lập biến môi trường
      - name: Set environment variables
        run: |
          echo "CLANG_PATH=$GITHUB_WORKSPACE/clang" >> $GITHUB_ENV
          echo "PATH=$GITHUB_WORKSPACE/clang/bin:$PATH" >> $GITHUB_ENV
          echo "LD=/usr/bin/ld" >> $GITHUB_ENV
          echo "HOSTLD=/usr/bin/ld" >> $GITHUB_ENV
          echo "HOSTCC=gcc" >> $GITHUB_ENV

      # Bước 5: Kiểm tra và sửa Makefile
      - name: Check and patch Makefile
        run: |
          if [ -f Makefile ]; then
            echo "Checking main Makefile"
            grep -E "HOSTLD|LD|HOSTCC" Makefile || echo "No HOSTLD/LD/HOSTCC found"
            sed -i '/ifneq ($(LLVM),)/,/endif/ s/HOSTCC.*=.*/HOSTCC = gcc/' Makefile
            sed -i '/ifneq ($(LLVM),)/,/endif/ s/LD.*=.*/LD = \/usr\/bin\/ld/' Makefile
            echo "HOSTLD = /usr/bin/ld" >> Makefile
            echo "Patched Makefile:"
            grep -E "HOSTLD|LD|HOSTCC" Makefile
          else
            echo "Error: Main Makefile not found"
            exit 1
          fi
          if [ -f scripts/Makefile.host ]; then
            echo "Checking scripts/Makefile.host"
            grep -E "HOSTLD|LD|HOSTCC" scripts/Makefile.host || echo "No HOSTLD/LD/HOSTCC in scripts/Makefile.host"
            sed -i '/HOSTLD/d' scripts/Makefile.host
            sed -i '/HOSTCC/d' scripts/Makefile.host
            echo "HOSTLD = /usr/bin/ld" >> scripts/Makefile.host
            echo "HOSTCC = gcc" >> scripts/Makefile.host
            echo "Patched scripts/Makefile.host:"
            cat scripts/Makefile.host
          else
            echo "Error: scripts/Makefile.host not found"
            exit 1
          fi
          if [ -f scripts/basic/Makefile ]; then
            echo "Checking scripts/basic/Makefile"
            grep -E "HOSTLD|LD|HOSTCC" scripts/basic/Makefile || echo "No HOSTLD/LD/HOSTCC in scripts/basic/Makefile"
            sed -i '/HOSTLD/d' scripts/basic/Makefile
            sed -i '/HOSTCC/d' scripts/basic/Makefile
            echo "HOSTLD = /usr/bin/ld" >> scripts/basic/Makefile
            echo "HOSTCC = gcc" >> scripts/basic/Makefile
            echo "Patched scripts/basic/Makefile:"
            cat scripts/basic/Makefile
          fi
          if [ -f drivers/kernelsu/Makefile ]; then
            echo "Checking module Makefile"
            cat drivers/kernelsu/Makefile
          else
            echo "Warning: drivers/kernelsu/Makefile not found"
            exit 1
          fi

      # Bước 6: Kiểm tra và sao chép .config
      - name: Copy .config
        run: |
          if [ -f .config ]; then
            echo "Found .config in repository root"
            mkdir -p out
            cp .config out/.config
          else
            echo "Error: .config not found in repository root"
            exit 1
          fi

      # Bước 7: Chuẩn bị môi trường kernel
      - name: Prepare kernel build environment
        run: |
          make O=out ARCH=arm64 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            CC=clang \
            LD=/usr/bin/ld \
            HOSTLD=/usr/bin/ld \
            HOSTCC=gcc \
            LLVM=1 \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            olddefconfig
          make O=out ARCH=arm64 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            CC=clang \
            LD=/usr/bin/ld \
            HOSTLD=/usr/bin/ld \
            HOSTCC=gcc \
            LLVM=1 \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            modules_prepare

      # Bước 8: Biên dịch kernel modules
      - name: Build kernel modules
        run: |
          make O=out ARCH=arm64 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            CC=clang \
            LD=/usr/bin/ld \
            HOSTLD=/usr/bin/ld \
            HOSTCC=gcc \
            LLVM=1 \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            M=drivers/kernelsu modules

      # Bước 9: Lưu trữ Module.symvers
      - name: Upload Module.symvers
        uses: actions/upload-artifact@v4
        with:
          name: Module.symvers
          path: out/Module.symvers
          retention-days: 7

      # Bước 10: Lưu trữ .ko modules
      - name: Upload .ko modules
        uses: actions/upload-artifact@v4
        with:
          name: kernel-modules
          path: |
            out/drivers/kernelsu/*.ko
          retention-days: 7

      # Bước 11: Kiểm tra kết quả
      - name: Verify artifacts
        run: |
          ls -l out/Module.symvers out/drivers/kernelsu/*.ko || echo "No artifacts found"
