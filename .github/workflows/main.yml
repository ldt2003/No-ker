name: Build Kernel Module with Custom Config

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # Bước 1: Tải mã nguồn từ kho lưu trữ
      - name: Checkout repository
        uses: actions/checkout@v4

      # Bước 2: Cài đặt công cụ và kernel headers
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential linux-headers-$(uname -r) kmod bc flex bison libelf-dev libssl-dev

      # Bước 3: Sao chép .config vào thư mục kernel
      - name: Copy .config
        run: |
          if [ -f .config ]; then
            echo "Found .config in repository root"
          else
            echo "Error: .config not found in repository root"
            exit 1
          fi

      # Bước 4: Chuẩn bị môi trường kernel với .config
      - name: Prepare kernel build environment
        run: |
          make olddefconfig
          make modules_prepare
        env:
          KDIR: /lib/modules/$(uname -r)/build

      # Bước 5: Biên dịch kernel module
      - name: Build kernel module
        run: |
          make M=drivers/<your_driver_path> modules
        env:
          KDIR: /lib/modules/$(uname -r)/build

      # Bước 6: Lưu trữ driver (.ko) và Module.symvers
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kernel-module-artifacts
          path: |
            drivers/<your_driver_path>/*.ko
            Module.symvers
          retention-days: 7

      # Bước 7: Kiểm tra kết quả
      - name: Verify artifacts
        run: |
          ls -l drivers/<your_driver_path>/*.ko Module.symvers || echo "No artifacts found"
